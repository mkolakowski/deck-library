<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Library</title>
<meta name="description" content="Magic: The Gathering decks built for a Playmat server, with card art and .dck downloads.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%226%22 y=%223%22 width=%2220%22 height=%2226%22 rx=%223%22 fill=%22%231f4a33%22/%3E%3Crect x=%229%22 y=%226%22 width=%2214%22 height=%2210%22 rx=%221%22 fill=%22%23e0b04f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a collector's own deck box, practical and proud, built to play from.
   IDEA: a deck box shelf on playmat felt: the library is a shelf of boxes; a deck opens onto the mat.
   PICTURE: the cards themselves: deck boxes on the shelf, then a gallery of sleeved cards with their printing's art.
   COLOUR and TYPE: playmat felt green field, ivory card stock, brass accent; Barlow Condensed labels, Inter body.
   LAYOUT: library home (filters, search, sort, deck box grid) and deck page (header, curve, actions, gallery/list). */
:root{color-scheme:light dark;
  --bg:light-dark(#e9efe8,#0f1a14);--felt:light-dark(#1f4a33,#163826);--felt2:light-dark(#2b5e42,#1d4630);
  --card:light-dark(#fffdf7,#1b2620);--ink:light-dark(#16201a,#e8eee9);--soft:light-dark(#566559,#9fb0a5);
  --line:light-dark(#d6ddd5,#2c3b32);--brass:light-dark(#a8741a,#e0b04f);--on-felt:#f3efe2}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.lab,th,.box b{font-family:"Barlow Condensed",Inter,sans-serif}
a{color:inherit}
.top{background:radial-gradient(120% 140% at 20% 0%,var(--felt2),var(--felt));color:var(--on-felt);padding:22px max(5vw,16px)}
.top .row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;max-width:1240px;margin:0 auto}
.top h1{margin:0;font-size:clamp(30px,5vw,46px);line-height:1.05;font-weight:700}
.top h1 a{text-decoration:none}
.top p{margin:4px 0 0;opacity:.85;max-width:62ch;font-size:15px}
.switch{display:flex;gap:8px;align-items:center}
.switch select{background:rgba(255,255,255,.12);color:var(--on-felt);border-color:rgba(255,255,255,.25);max-width:min(78vw,340px)}
.switch select option,.switch select optgroup{color:#16201a;background:#fffdf7}
main{padding:24px max(5vw,16px) 56px;max-width:1240px;margin:0 auto}
#backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none;background:center 25%/cover no-repeat;opacity:0;transition:opacity .5s;-webkit-mask-image:linear-gradient(to bottom,#000 0,rgba(0,0,0,.55) 45%,transparent 90%);mask-image:linear-gradient(to bottom,#000 0,rgba(0,0,0,.55) 45%,transparent 90%)}
#backdrop.on{opacity:.22}
@media(prefers-reduced-motion:reduce){#backdrop{transition:none}}
button,select,input{font:16px Inter,sans-serif}
.act,.chip,select,input[type=search]{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px}
.act,.chip{font-weight:600;font-size:15px;cursor:pointer}
.act.main{background:var(--brass);border-color:var(--brass);color:#1b1305}
.chip[aria-pressed=true]{background:var(--felt);border-color:var(--felt);color:var(--on-felt)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.tools input[type=search]{flex:1 1 200px}
.count{color:var(--soft);font-size:14px;margin:-6px 0 14px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.box{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 8px 20px rgba(0,0,0,.10);transition:transform .15s}
.box:hover{transform:translateY(-2px)}
.box .lid{height:190px;position:relative;display:flex;align-items:flex-end;padding:10px 12px;color:#fff}
.box .lid{overflow:hidden}.box .lid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.rows{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 4px 12px rgba(0,0,0,.08);padding-right:14px;min-height:96px}
.drow:hover{box-shadow:0 1px 0 var(--line),0 6px 16px rgba(0,0,0,.14)}
.drow .th{align-self:stretch;position:relative;overflow:hidden}.drow .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.drow .mid{padding:10px 0;display:flex;flex-direction:column;gap:4px;min-width:0}.drow b{font-size:20px;line-height:1.1}
.drow .mid p{margin:0;color:var(--soft);font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drow .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;color:var(--soft);white-space:nowrap}
.drow .tagrow .tag{margin:0 6px 0 0}.drow .mid .ln{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.drow .mid .ln .tag{margin:0}
@media(max-width:600px){.drow{grid-template-columns:88px minmax(0,1fr)}.drow .meta{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between;padding-bottom:10px}}
.box .lid .fmt{position:relative}
.box .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.box b{font-size:23px;line-height:1.05;font-weight:700}
.box p{margin:0;color:var(--soft);font-size:14px;line-height:1.4}
.box .ft{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;font-size:13px;color:var(--soft)}
.fmt{display:inline-block;font:600 14px "Barlow Condensed",sans-serif;background:var(--felt);color:var(--on-felt);padding:2px 10px;border-radius:99px}
.lid .fmt{background:rgba(0,0,0,.55)}
.tag{display:inline-block;font:600 13px "Barlow Condensed",sans-serif;border:1px solid var(--line);color:var(--soft);background:transparent;padding:1px 9px;border-radius:99px;margin-left:6px}
button.tag{cursor:pointer;min-height:0}button.tag:hover{color:var(--ink);border-color:var(--ink)}
.tagrow{margin:4px 0 0}.tagrow .tag{margin:0 6px 0 0}
.tools.tags .chip{font-size:14px;min-height:38px}.box .lid::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.35))}.box .lid .fmt{z-index:1}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:15px;margin-bottom:14px;min-height:44px}
.head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.head h2{margin:8px 0 0;font-size:clamp(30px,4vw,44px);line-height:1.05;font-weight:700}
.pitch{margin:8px 0 14px;color:var(--soft);max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 14px}
.stats div{display:flex;flex-direction:column}
.stats b{font:700 26px/1 "Barlow Condensed",sans-serif}
.stats span{font-size:13px;color:var(--soft)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font:700 11px Inter,sans-serif;color:#1a1a1a;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.pW{background:#f6eecb}.pU{background:#9fcbe8}.pB{background:#b8aeaa}.pR{background:#ef9f7f}.pG{background:#9cc79a}.pC{background:#d3d3cf}
.curve{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.curve .lab{font-size:16px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:110px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--soft)}
.bar i{display:block;width:100%;background:var(--felt2);border-radius:4px 4px 0 0;min-height:2px}
.bar em{font-style:normal;font-weight:600;color:var(--ink)}
.types{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13px}
.types span{background:var(--bg);border-radius:6px;padding:2px 8px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--soft);min-height:20px;margin-top:6px}
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 14px;border-top:1px solid var(--line);padding-top:18px}
.bar2 input[type=search]{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);min-height:42px;padding:0 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--felt);color:var(--on-felt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,180px),1fr));gap:16px}
.grid[data-size=S]{--tile:140px}.grid[data-size=M]{--tile:180px}.grid[data-size=L]{--tile:250px}.grid[data-size=XL]{--tile:340px}
.grid[data-size=L] .c .art .tx,.grid[data-size=XL] .c .art .tx{font-size:13px}.grid[data-size=L] .c .art .nm,.grid[data-size=XL] .c .art .nm{font-size:21px}
.c{background:var(--card);border-radius:12px;padding:7px;box-shadow:0 1px 0 var(--line),0 6px 16px rgba(0,0,0,.12);display:flex;flex-direction:column;position:relative}
.c .art{aspect-ratio:488/680;border-radius:8px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff;text-decoration:none;border:0;width:100%;text-align:left;font:inherit;cursor:zoom-in}
.c .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c .art .nm{position:relative;font:700 17px/1.1 "Barlow Condensed",sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.c .art .ty{position:relative;font-size:12px;opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.c .art .tx{position:relative;font-size:11.5px;line-height:1.35;background:rgba(0,0,0,.28);border-radius:6px;padding:6px;max-height:42%;overflow:hidden}
.c .art .pr{position:relative;align-self:flex-end;font:700 13px Inter,sans-serif;background:rgba(0,0,0,.35);padding:1px 7px;border-radius:6px}
.c .q{position:absolute;top:-8px;left:-8px;background:var(--brass);color:#1b1305;font:700 15px "Barlow Condensed",sans-serif;min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;padding:0 6px;z-index:1}
.c .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 2px 1px;font-size:13px}
.c .meta a{color:var(--soft);white-space:nowrap}
.sec{font-size:24px;font-weight:700;margin:28px 0 6px}
.guide{margin:22px 0 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 18px}
.guide>summary{font:700 22px "Barlow Condensed",Inter,sans-serif;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:8px;list-style:none}
.guide>summary::-webkit-details-marker{display:none}.guide>summary::before{content:'▸';color:var(--brass)}.guide[open]>summary::before{content:'▾'}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 32px;padding:0 0 18px}
.guide .wins{font-size:17px;margin:0 0 12px}
.guide h4{font:600 18px "Barlow Condensed",Inter,sans-serif;margin:14px 0 6px}
.guide p{margin:0}
.plan{margin:0;padding:0;list-style:none;counter-reset:s}.plan li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;margin:0 0 10px}
.plan li::before{content:counter(s);grid-row:span 2;width:26px;height:26px;border-radius:50%;background:var(--felt);color:var(--on-felt);display:grid;place-items:center;font:700 14px Inter,sans-serif}
.plan b,.keys b{display:block}.plan span,.keys span{color:var(--soft)}
.keys,.tips{margin:0;padding-left:18px}.keys li,.tips li{margin:0 0 8px}.keys span{display:block}
.cardlink{all:unset;font-weight:700;cursor:zoom-in;border-bottom:1px dashed var(--brass)}.cardlink:focus-visible{outline:3px solid var(--brass)}
@media(max-width:820px){.gwrap{grid-template-columns:minmax(0,1fr)}}
.grp{margin:0 0 6px}.grp>summary{font:600 26px "Barlow Condensed",Inter,sans-serif;cursor:pointer;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--line);margin-bottom:14px}
.grp>summary::-webkit-details-marker{display:none}.grp>summary::before{content:'▸';transition:transform .15s;color:var(--soft)}.grp[open]>summary::before{transform:rotate(90deg)}
.grp:not([open])>summary{margin-bottom:0}
tr.gh td,tr.sh td{font:600 22px "Barlow Condensed",Inter,sans-serif;background:var(--bg);padding:8px 10px}tr.sh td{font-size:26px;background:var(--line)}
@media(prefers-reduced-motion:reduce){.grp>summary::before{transition:none}}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th{font-size:16px;font-weight:600;text-align:left;padding:10px;border-bottom:2px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th[aria-sort=ascending]::after{content:" ▲";font-size:11px}th[aria-sort=descending]::after{content:" ▼";font-size:11px}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;font-size:12.5px;color:var(--soft)}
td a{white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--soft)}
.zoom{position:fixed;inset:0;z-index:8;background:rgba(6,12,9,.86);display:grid;grid-template-rows:minmax(0,1fr) auto;align-items:center;justify-items:center;padding:16px;gap:10px}
.zoom[hidden]{display:none}
.zoom .pic{width:min(94vw,560px,calc((100vh - 140px) * 488 / 680));height:auto;aspect-ratio:488/680;border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:20px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.zoom .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.zoom .pic .nm{font:700 30px/1.05 "Barlow Condensed",sans-serif}.zoom .pic .ty{font-size:15px;opacity:.9}.zoom .pic .tx{font-size:16px;line-height:1.45;background:rgba(0,0,0,.3);border-radius:8px;padding:10px}
.zoom .zb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;color:#f3efe2;font-size:15px}
.zoom .zb button,.zoom .zb a{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#f3efe2;font:600 15px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.zoom .zb .zt{padding:0 6px;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
footer{max-width:1240px;margin:0 auto;padding:0 max(5vw,16px) 40px;color:var(--soft);font-size:13px}
.act[href]{display:inline-flex;align-items:center;text-decoration:none}
@media(prefers-reduced-motion:reduce){.toast,.box{transition:none}}
@media(max-width:820px){.head{grid-template-columns:1fr}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--soft)}.stack td:empty{display:none}.stack tr.gh,.stack tr.sh{display:block;padding:0}.stack tr.gh td,.stack tr.sh td{padding:8px 10px}.stack tr.gh td::before,.stack tr.sh td::before{content:none}.grid{gap:12px}.grid[data-size=S]{grid-template-columns:repeat(3,minmax(0,1fr))}.grid[data-size=M]{grid-template-columns:repeat(2,minmax(0,1fr))}.grid[data-size=L]{grid-template-columns:minmax(0,300px);justify-content:center}.grid[data-size=XL]{grid-template-columns:minmax(0,1fr)}.switch{width:100%}.switch select{max-width:none;flex:1}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent.replace(/[▲▼]/g,'').trim()||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="top">
  <div class="row">
    <div><h1><a href="#library">Deck Library</a></h1><p id="intro">Magic: The Gathering decks built for a Playmat server.</p></div>
    <label class="switch"><select id="jump" aria-label="Jump to a deck"><option value="library">All decks</option></select></label>
  </div>
</header>
<div id="backdrop" aria-hidden="true"></div>
<main id="main"><div class="empty">Loading decks…</div></main>
<footer>Card data and images from <a href="https://scryfall.com">Scryfall</a>. Magic: The Gathering cards and art © Wizards of the Coast; this is an unofficial fan page, not endorsed by Wizards or Scryfall.</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="Card"><div class="pic" id="zpic"></div><div class="zb"><button id="zprev" aria-label="Previous card">←</button><span class="zt" id="zt"></span><button id="znext" aria-label="Next card">→</button><a id="zs" href="#">Scryfall</a><button id="zx">Close</button></div></div>
<script>
{
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FRAME = {W:['#e9dfb8','#b9a774'],U:['#3b78b5','#1d3f66'],B:['#4a403f','#1d1918'],R:['#c4502e','#6e2414'],G:['#3f8a4c','#1c4a26'],C:['#8e8f8c','#4c4d4a'],M:['#caa04a','#7a5a1c'],L:['#8a6b46','#4a3622']};
const FORMATS = ['Standard', 'Pioneer', 'Modern', 'Legacy', 'Vintage', 'Commander', 'Pauper', 'Other'];
const TYPES = ['Creature', 'Planeswalker', 'Battle', 'Instant', 'Sorcery', 'Artifact', 'Enchantment', 'Land'];
const store = {get(k, d){ try { return JSON.parse(localStorage.getItem('decklib.' + k)) ?? d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem('decklib.' + k, JSON.stringify(v)); } catch(e){} }};
let INDEX = [], DCK = {}, CACHE = {}, SHOWN = [], ZI = -1;
const lib = Object.assign({fmt: 'All', tag: 'All', q: '', sort: 'updated', view: 'grid'}, store.get('lib', {}));
const tagsOf = d => Array.isArray(d.tags) ? d.tags : [];
const tagPills = d => tagsOf(d).map(t => `<span class="tag">#${esc(t)}</span>`).join('');
const st = {view: store.get('view', 'gallery'), size: store.get('size', 'M'), group: store.get('group', 'type'), sec: 'All', q: '', sort: {key: 'mv', dir: 1}};
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---------- Scryfall: card data + image links, cached in the browser for 14 days ---------- */
const SCRY = {}; const TTL = 14 * 864e5;
const key = (set, num) => `${set}-${num}`.toLowerCase();
function cached(k){ const v = store.get('c.' + k, null); return v && Date.now() - v.t < TTL ? v.c : null; }
function trim(card){
  const f = card.card_faces?.[0] || {};
  const img = card.image_uris || f.image_uris || {};
  const type = card.type_line || f.type_line || '';
  const front = type.split(' // ')[0];
  const isLand = /\bLand\b/.test(front);
  return {name: card.name, type, cost: card.mana_cost || f.mana_cost || '', mv: Math.round(card.cmc || 0),
    colors: (card.colors || f.colors || []).join(''), text: (card.oracle_text || f.oracle_text || '').replace(/\n/g, ' · '),
    pt: card.power != null ? `${card.power}/${card.toughness}` : (f.power != null ? `${f.power}/${f.toughness}` : ''),
    main: isLand ? 'Land' : (TYPES.find(t => front.includes(t)) || 'Other'),
    img: img.normal || '', big: img.large || img.normal || '', uri: card.scryfall_uri || ''};
}
async function scryfall(ids){
  // ids: [{set, num, name}] -> fills SCRY[key]; batches of 75, falls back to name lookup
  const need = ids.filter(i => !SCRY[key(i.set, i.num)] && !(SCRY[key(i.set, i.num)] = cached(key(i.set, i.num))));
  const post = async body => { const r = await fetch('https://api.scryfall.com/cards/collection', {method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify({identifiers: body})}); if (!r.ok) throw new Error(r.status); return r.json(); };
  for (let i = 0; i < need.length; i += 75){
    const chunk = need.slice(i, i + 75);
    const res = await post(chunk.map(c => ({set: c.set.toLowerCase(), collector_number: c.num})));
    for (const card of res.data){
      const c = chunk.find(x => x.set.toLowerCase() === card.set && x.num.toLowerCase() === String(card.collector_number).toLowerCase());
      if (c){ const t = trim(card); SCRY[key(c.set, c.num)] = t; store.set('c.' + key(c.set, c.num), {t: Date.now(), c: t}); }
    }
    const missing = chunk.filter(c => !SCRY[key(c.set, c.num)] && c.name);
    if (missing.length){
      await new Promise(r => setTimeout(r, 120));
      const res2 = await post(missing.map(c => ({name: c.name})));
      for (const card of res2.data) for (const c of missing.filter(x => x.name.toLowerCase() === card.name.toLowerCase() || card.name.toLowerCase().startsWith(x.name.toLowerCase() + ' //'))){
        const t = trim(card); SCRY[key(c.set, c.num)] = t; store.set('c.' + key(c.set, c.num), {t: Date.now(), c: t});
      }
    }
    if (i + 75 < need.length) await new Promise(r => setTimeout(r, 120));
  }
}

/* ---------- .dck files ---------- */
function parseDck(text, format){
  const cards = [];
  for (let line of text.split(/\r?\n/)){
    line = line.trim(); if (!line || line.startsWith('NAME:')) continue;
    const side = line.startsWith('SB:'); if (side) line = line.slice(3).trim();
    const m = line.match(/^(\d+)\s+\[([^:\]]+):([^\]]+)\]\s+(.+)$/) || line.match(/^(\d+)\s+()()(.+)$/);
    if (!m) continue;
    cards.push({q: +m[1], set: m[2], num: m[3], name: m[4], sec: side ? (format === 'Commander' ? 'Commander' : 'Sideboard') : 'Main'});
  }
  return cards;
}
async function getDck(d){ if (!DCK[d.id]){ const r = await fetch('decks/' + encodeURIComponent(d.file)); if (!r.ok) throw new Error(r.status); DCK[d.id] = await r.text(); } return DCK[d.id]; }
async function loadDeck(id){
  if (CACHE[id]) return CACHE[id];
  const d = INDEX.find(x => x.id === id); const text = await getDck(d);
  const cards = parseDck(text, d.format);
  try { await scryfall(cards.filter(c => c.set)); } catch(e){ toast('Scryfall didn’t answer; showing names only'); }
  for (const c of cards) Object.assign(c, {type: '', cost: '', mv: 0, colors: '', text: '', pt: '', main: /^(Plains|Island|Swamp|Mountain|Forest|Wastes)$/.test(c.name) ? 'Land' : 'Other', img: '', big: ''}, SCRY[key(c.set, c.num)] || {}, {name: c.name});
  let guide = null; try { const r = await fetch('decks/guides/' + encodeURIComponent(id) + '.json'); if (r.ok) guide = await r.json(); } catch(e){}
  return CACHE[id] = Object.assign({}, d, {dck: text, cards, guide});
}

/* ---------- deck page ---------- */
function stats(d){
  const main = d.cards.filter(c => c.sec !== 'Sideboard'); const spells = main.filter(c => c.main !== 'Land');
  const nsp = spells.reduce((a, c) => a + c.q, 0); const curve = Array(8).fill(0); spells.forEach(c => curve[Math.min(c.mv, 7)] += c.q);
  const types = {}; main.forEach(c => types[c.main] = (types[c.main] || 0) + c.q);
  return {total: main.reduce((a, c) => a + c.q, 0), avg: nsp ? spells.reduce((a, c) => a + c.q * c.mv, 0) / nsp : 0, lands: types.Land || 0,
    cols: [...'WUBRG'].filter(k => main.some(c => c.colors.includes(k))).join('') || d.colors, curve, types,
    side: d.cards.filter(c => c.sec === 'Sideboard').reduce((a, c) => a + c.q, 0)};
}
function plainList(d){
  const sec = s => d.cards.filter(c => c.sec === s).map(c => `${c.q} ${c.name}`).join('\n');
  const out = d.format === 'Commander' ? 'Commander\n' + sec('Commander') + '\n\nDeck\n' + sec('Main') : 'Deck\n' + sec('Main');
  const sb = sec('Sideboard'); return out + (sb ? '\n\nSideboard\n' + sb : '') + '\n';
}
function cmp(a, b){
  const {key: k, dir} = st.sort; let x = a[k], y = b[k];
  if (k === 'printing'){ x = a.set + ' ' + a.num.padStart(4, '0'); y = b.set + ' ' + b.num.padStart(4, '0'); }
  return (typeof x === 'string' ? dir * x.localeCompare(y) : dir * (x - y)) || a.name.localeCompare(b.name);
}
const visible = d => { const q = st.q.trim().toLowerCase(); return d.cards.filter(c => (st.sec === 'All' || c.sec === st.sec) && (!q || (c.name + ' ' + c.type + ' ' + c.text).toLowerCase().includes(q))).sort(cmp); };

}
const GROUPS = {
  type: {label: 'Type', key: c => c.main, order: [...TYPES, 'Other'], name: (k, n) => ({Creature: 'Creatures', Planeswalker: 'Planeswalkers', Battle: 'Battles', Instant: 'Instants', Sorcery: 'Sorceries', Artifact: 'Artifacts', Enchantment: 'Enchantments', Land: 'Lands'}[k] || 'Other') + ' · ' + n},

    <input type="search" id="q" placeholder="Search name, type or text" value="${esc(st.q)}" aria-label="Search cards">
  </div>
  <div id="body">${body(d)}</div>`;
  syncUrl();
}

/* ---------- zoom ---------- */
function zoomTo(i){
  if (!SHOWN.length) return; ZI = (i + SHOWN.length) % SHOWN.length; const c = SHOWN[ZI];
  const [a, b] = frameOf(c); const img = safeImg(c.big || c.img); const p = $('#zpic');
  p.style.background = `linear-gradient(160deg,${a},${b})`;
  p.innerHTML = img ? `<img src="${esc(img)}" alt="${esc(c.name)}">` : `<div><div class="nm">${esc(c.name)}</div><div class="ty">${esc(c.type)}</div></div>${c.text ? `<div class="tx">${esc(c.text)}</div>` : '<div></div>'}<div class="ty" style="align-self:flex-end;font-weight:700">${esc(c.pt)}</div>`;
  $('#zt').textContent = `${c.q} × ${c.name}${c.set ? ` · ${c.set} #${c.num}` : ''} · ${ZI + 1} of ${SHOWN.length}`;
  $('#zs').href = scryLink(c); const z = $('#zoom'); if (z.hidden){ z.hidden = false; $('#zx').focus(); }
}
function zoomClose(){ const z = $('#zoom'); if (z.hidden) return; z.hidden = true; document.querySelector(`.art[data-z="${ZI}"]`)?.focus(); ZI = -1; }

/* ---------- routing + events ---------- */
/* The address reflects the current choices: #<deck>?view=&size=&group=&section=&sort=&dir=&q= or #library?view=&format=&tag=&sort=&q=.
   A link with a ?query is applied as-is (missing values mean defaults); a bare #<deck> keeps the viewer's own saved choices. */
const hashParts = () => { const h = location.hash.slice(1); const i = h.indexOf('?'); let r = i < 0 ? h : h.slice(0, i); try { r = decodeURIComponent(r); } catch(e){} return [r, new URLSearchParams(i < 0 ? '' : h.slice(i + 1)), i >= 0]; };
const route = () => { const h = hashParts()[0]; return INDEX.some(d => d.id === h) ? h : 'library'; };
const LIB_SORTS = ['updated', 'added', 'name', 'format'], CARD_SORTS = ['mv', 'name', 'main', 'q', 'printing', 'sec'];
function applyUrl(r){
  const [, p, has] = hashParts(); if (!has) return false;
  const g = (k, ok, dflt) => { const v = p.get(k); return v != null && ok(v) ? v : dflt; };
  if (r === 'library'){
    lib.view = g('view', v => ['grid', 'list'].includes(v), 'grid'); lib.fmt = g('format', v => INDEX.some(d => d.format === v), 'All');
    lib.tag = g('tag', v => INDEX.some(d => tagsOf(d).includes(v)), 'All'); lib.sort = g('sort', v => LIB_SORTS.includes(v), 'updated'); lib.q = g('q', () => true, '');
  } else {
    st.view = g('view', v => ['gallery', 'list'].includes(v), 'gallery') === 'list' ? 'table' : 'gallery';
    st.size = g('size', v => ['S', 'M', 'L', 'XL'].includes(v), 'M'); st.group = g('group', v => Object.hasOwn(GROUPS, v), 'type');
    st.sec = g('section', v => ['Commander', 'Main', 'Sideboard'].includes(v), 'All'); st.q = g('q', () => true, '');
    st.sort = {key: g('sort', v => CARD_SORTS.includes(v), 'mv'), dir: p.get('dir') === 'desc' ? -1 : 1};
  }
  return true;
}
function syncUrl(){
  const r = route(), p = new URLSearchParams(), put = (k, v, d) => { if (v !== d) p.set(k, v); };
  if (r === 'library'){ p.set('view', lib.view); put('format', lib.fmt, 'All'); put('tag', lib.tag, 'All'); put('sort', lib.sort, 'updated'); put('q', lib.q.trim(), ''); }
  else { p.set('view', st.view === 'table' ? 'list' : 'gallery'); if (st.view !== 'table') put('size', st.size, 'M'); put('group', st.group, 'type'); put('section', st.sec, 'All');
    put('sort', st.sort.key, 'mv'); if (st.sort.dir < 0) p.set('dir', 'desc'); put('q', st.q.trim(), ''); }
  const h = '#' + r + '?' + p.toString().replace(/\+/g, '%20');
  if (location.hash !== h) history.replaceState(history.state, '', h);
}
let shown = null;
function show(){ const r = route(); const fromUrl = applyUrl(r); if (r !== shown && !fromUrl){ st.sec = 'All'; st.q = ''; } shown = r; if (r === 'library') renderLibrary(); else renderDeck(r); }
const cur = () => CACHE[route()];
function rerenderBody(){ const d = cur(); if (d) $('#body').innerHTML = body(d); syncUrl(); }
async function copy(text, what){
  try { await navigator.clipboard.writeText(text); toast(what + ' copied'); }
  catch(e){ toast('Copy was blocked; the text is in the box below'); const f = $('#fallback'); f.hidden = false; f.querySelector('textarea').value = text; f.querySelector('textarea').select(); }
}
document.addEventListener('click', async e => {
  if (e.target.id === 'zoom'){ zoomClose(); return; }
  const t = e.target.closest('button, th'); if (!t) return; const d = cur();
  if (t.dataset.z !== undefined){ zoomTo(+t.dataset.z); return; }
  if (t.dataset.card && d){ let i = SHOWN.findIndex(c => c.name === t.dataset.card); if (i < 0){ SHOWN = d.cards.slice(); i = SHOWN.findIndex(c => c.name === t.dataset.card); } if (i >= 0) zoomTo(i); return; }
  if (t.id === 'zprev') return zoomTo(ZI - 1); if (t.id === 'znext') return zoomTo(ZI + 1); if (t.id === 'zx') return zoomClose();
  if (t.dataset.size){ st.size = t.dataset.size; store.set('size', st.size); document.querySelectorAll('[data-size]').forEach(x => { if (x.tagName === 'BUTTON') x.setAttribute('aria-pressed', x.dataset.size === st.size); else x.dataset.size = st.size; }); syncUrl(); return; }
  if (t.dataset.fmt){ lib.fmt = t.dataset.fmt; store.set('lib', lib); renderLibrary(); }
  else if (t.dataset.lview){ lib.view = t.dataset.lview; store.set('lib', lib); renderLibrary(); }
  else if (t.dataset.tag){ lib.tag = t.dataset.tag; store.set('lib', lib); renderLibrary(); }
  else if (t.dataset.gotag){ lib.tag = t.dataset.gotag; lib.fmt = 'All'; store.set('lib', lib); location.hash = '#library'; }
  else if (t.dataset.v){ st.view = t.dataset.v; store.set('view', st.view); renderDeck(route()); }
  else if (t.id === 'dir'){ st.sort.dir *= -1; renderDeck(route()); }
  else if (t.tagName === 'TH'){ const k = t.dataset.k; st.sort = {key: k, dir: st.sort.key === k ? -st.sort.dir : 1}; renderDeck(route()); }
  else if (t.id === 'cpd' && d) copy(d.dck, '.dck file');
  else if (t.id === 'cpl' && d) copy(plainList(d), 'Deck list');
  else if (t.id === 'cplink') copy(location.href, 'Link');
});
document.addEventListener('keydown', e => {
  if (!$('#zoom').hidden){ if (e.key === 'Escape') zoomClose(); else if (e.key === 'ArrowLeft') zoomTo(ZI - 1); else if (e.key === 'ArrowRight') zoomTo(ZI + 1); return; }
  if (e.key === 'Enter' && e.target.tagName === 'TH') e.target.click();
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'jump') location.hash = e.target.value;
  else if (id === 'lsort'){ lib.sort = e.target.value; store.set('lib', lib); renderLibrary(); }
  else if (id === 'sec'){ st.sec = e.target.value; rerenderBody(); }
  else if (id === 'grp'){ st.group = e.target.value; store.set('group', st.group); rerenderBody(); }
  else if (id === 'sort'){ st.sort = {key: e.target.value, dir: 1}; renderDeck(route()); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ st.q = e.target.value; rerenderBody(); }
  if (e.target.id === 'lq'){ lib.q = e.target.value; store.set('lib', lib); const pos = e.target.selectionStart; renderLibrary(); const i = $('#lq'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('toggle', e => { if (e.target.id === 'guide'){ store.set('guideOpen', e.target.open); return; } const g = e.target.dataset?.g; if (!g) return; const c = new Set(store.get('closed', [])); e.target.open ? c.delete(g) : c.add(g); store.set('closed', [...c].slice(-200)); }, true);
addEventListener('hashchange', () => { zoomClose(); show(); window.scrollTo({top: 0}); });

(async () => {
  try {
    INDEX = await (await fetch('decks/manifest.json', {cache: 'no-cache'})).json();
    $('#intro').textContent = `${INDEX.length} Magic: The Gathering decks built for a Playmat server, each at its latest version.`;
    show();
    await Promise.all(INDEX.map(d => getDck(d).catch(() => {})));
    try { await scryfall(INDEX.filter(d => d.face).map(d => ({set: d.face.set, num: d.face.num, name: ''}))); } catch(e){}
    if (route() === 'library') renderLibrary();
  } catch(e){ $('#main').innerHTML = '<div class="empty">The deck list didn’t load. Reload the page to try again.</div>'; }
})();
}
</script>
</body>
</html>
